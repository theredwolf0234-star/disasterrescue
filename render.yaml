services:
  - type: web
    name: disaster-rescuecoordinator
    env: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: node backend/src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
