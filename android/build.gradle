// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    def customBuildDir = System.getenv("ANDROID_BUILD_DIR")
    if (customBuildDir) {
        buildDir = new File(customBuildDir, project.name)
    } else if (System.getProperty("os.name").toLowerCase().contains("windows") && new File("C:/Users/satyam pathak").exists()) {
        buildDir = new File("C:/Users/satyam pathak/.android_builds/aister", project.name)
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
