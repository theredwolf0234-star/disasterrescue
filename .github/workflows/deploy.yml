name: Auto Deploy to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Automatic Render Cloud Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (Automatic Webhook)
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering automated deployment on Render..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
            echo "Render Deploy Hook response code: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Deployment successfully initiated on Render!"
            else
              echo "Deploy hook returned HTTP $HTTP_CODE"
            fi
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not yet configured in GitHub repository secrets."
            echo "Render native auto-deploy tracks branch 'main' directly from render.yaml blueprint."
          fi
